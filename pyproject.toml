[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epicstaff-mcp"
version = "1.1.0"
description = "Modular MCP server for EpicStaff flow management"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: exercises a real EpicStaff backend (opt-in; skipped unless EPICSTAFF_LIVE=1)",
]

[project.scripts]
epicstaff-mcp = "epicstaff_mcp.servers.combined_server:main"
epicstaff-mcp-flows = "epicstaff_mcp.servers.flows_server:main"
epicstaff-mcp-projects = "epicstaff_mcp.servers.projects_server:main"
epicstaff-mcp-organizations = "epicstaff_mcp.servers.organizations_server:main"

[tool.hatch.build.targets.wheel]
packages = ["epicstaff_mcp"]
